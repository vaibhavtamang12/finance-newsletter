name: Daily Finance Newsletter

on:
  # Runs at 06:30 UTC = 12:00 PM IST (Indian Standard Time, UTC+5:30)
  schedule:
    - cron: '30 6 * * *'
  # Also allows manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # These are available to every step below as normal environment variables.
    # Make sure a secret with each of these exact names exists under
    # Settings -> Secrets and variables -> Actions -> Repository secrets.
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      NEWSLETTER_SENDER_NAME: ${{ secrets.NEWSLETTER_SENDER_NAME }}
      NEWSLETTER_SENDER_EMAIL: ${{ secrets.NEWSLETTER_SENDER_EMAIL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      NEWSLETTER_MAX_ARTICLES: ${{ secrets.NEWSLETTER_MAX_ARTICLES }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install --upgrade -r requirements.txt

      - name: Verify Required Secrets
        run: |
          missing=0
          for var in GEMINI_API_KEY GMAIL_USER GMAIL_APP_PASSWORD GROQ_API_KEY SMTP_HOST SMTP_PORT SUPABASE_URL SUPABASE_SERVICE_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "One or more required secrets are not set in this repo's Actions secrets."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Initialize Runtime Directories
        run: |
          mkdir -p data/raw data/processed data/summaries
          mkdir -p logs/delivery_reports newsletters

      - name: Fetch RSS News
        run: python scripts/fetch_news.py

      - name: Fetch Live Market Data
        run: python scripts/fetch_market_data.py

      - name: Clean and Deduplicate News
        run: python scripts/clean_news.py

      - name: AI Summarization (Groq)
        run: python scripts/summarize_news.py

      - name: Generate Newsletter
        run: python scripts/generate_newsletter.py

      - name: Send Email
        run: python scripts/send_email.py

      - name: Commit Archives
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add newsletters/ logs/delivery_reports/
          git diff --cached --quiet && echo "No changes to commit" || (
            git commit -m "Newsletter: $(date +'%Y-%m-%d')" &&
            git push
          )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
